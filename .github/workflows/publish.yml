name: publish
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the prerelease and Docker Hub image
        type: boolean
        default: false
      sign_macos:
        description: Optional Developer ID signing and notarization (Apple account required)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: arca-${{ github.event.pull_request.number || 'release' }}
  cancel-in-progress: false
jobs:
  tests:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24.14.0"
          cache: npm
      - run: npm ci
      - name: Check version agreement
        run: node scripts/check-release.js
      - name: Run tests
        run: node --test --test-reporter=tap --test-timeout=120000 tests/*.test.js
        timeout-minutes: 10
  prepare:
    needs: tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      build: ${{ steps.release.outputs.build || steps.gate.outputs.build }}
      publish: ${{ steps.release.outputs.build || steps.gate.outputs.publish }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24.14.0"
      - id: version
        run: node scripts/check-release.js
      - name: Check whether the version needs publishing
        id: gate
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
          SIGN: ${{ inputs.sign_macos }}
          TAG: ${{ steps.version.outputs.tag }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [[ "$PUBLISH" == true ]]; then
            test "$GITHUB_REF" = refs/heads/main || { echo 'Publish from main only'; exit 1; }
            for key in DOCKERHUB_USERNAME DOCKERHUB_TOKEN; do
              test -n "${!key}" || { echo "Missing secret: $key"; exit 1; }
            done
          fi
          if [[ "$SIGN" == true ]]; then
            for key in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              test -n "${!key}" || { echo "Missing secret: $key"; exit 1; }
            done
          fi
          echo 'build=true' >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
      - name: Create or resume draft release
        id: release
        if: steps.gate.outputs.publish == 'true'
        uses: actions/github-script@v8
        env:
          TAG: ${{ steps.version.outputs.tag }}
        with:
          script: |
            const { prepareRelease } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/prepare-release.js`);
            const build = await prepareRelease({
              github, repo: context.repo, tag: process.env.TAG, sha: context.sha
            });
            core.setOutput('build', String(build));
  desktop:
    permissions:
      contents: write
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            name: macos-arm64
          - os: windows-2022
            name: windows-x64
          - os: ubuntu-22.04
            name: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24.14.0"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - name: Import Apple signing identity
        if: runner.os == 'macOS' && inputs.sign_macos
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/arca-signing.keychain-db"
          password=$(openssl rand -hex 24)
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/arca.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/arca.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          rm "$RUNNER_TEMP/arca.p12"
      - name: Build unsigned installers
        if: runner.os != 'macOS' || !inputs.sign_macos
        run: npm run desktop:release
      - name: Build signed macOS installers
        if: runner.os == 'macOS' && inputs.sign_macos
        env:
          ARCA_SIGN_MACOS: "true"
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run desktop:release
      - name: Verify runtime inside macOS installer
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          codesign --verify --deep --strict apps/desktop/src-tauri/target/release/bundle/macos/Arca.app
          mount="$RUNNER_TEMP/arca-dmg"
          mkdir -p "$mount"
          hdiutil attach apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg -readonly -nobrowse -mountpoint "$mount"
          trap 'hdiutil detach "$mount"' EXIT
          node scripts/verify-bundle.js "$mount/Arca.app/Contents/Resources/runtime"
      - name: Verify runtimes inside Linux packages
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          dpkg-deb -x apps/desktop/src-tauri/target/release/bundle/deb/*.deb "$RUNNER_TEMP/arca-deb"
          runtime=$(find "$RUNNER_TEMP/arca-deb" -type f -path '*/runtime/node' -print -quit)
          test -n "$runtime"
          node scripts/verify-bundle.js "$(dirname "$runtime")"
          appimage=$(realpath apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage)
          mkdir "$RUNNER_TEMP/arca-appimage"
          (cd "$RUNNER_TEMP/arca-appimage" && "$appimage" --appimage-extract >/dev/null)
          runtime=$(find "$RUNNER_TEMP/arca-appimage" -type f -path '*/runtime/node' -print -quit)
          test -n "$runtime"
          node scripts/verify-bundle.js "$(dirname "$runtime")"
      - name: Install Windows package and verify runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          $destination = Join-Path $env:RUNNER_TEMP 'arca-installed'
          $process = Start-Process -FilePath $installer.FullName -ArgumentList '/S',"/D=$destination" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'NSIS installation failed' }
          $runtime = Get-ChildItem $destination -Recurse -Filter node.exe | Select-Object -First 1
          if (!$runtime) { throw 'Installed Node runtime missing' }
          node scripts/verify-bundle.js $runtime.DirectoryName
          if ($LASTEXITCODE -ne 0) { throw 'Installed runtime failed' }
      - name: Verify notarization
        if: runner.os == 'macOS' && inputs.sign_macos
        run: |
          xcrun stapler validate apps/desktop/src-tauri/target/release/bundle/macos/Arca.app
          spctl --assess --type execute --verbose apps/desktop/src-tauri/target/release/bundle/macos/Arca.app
      - name: Collect installers
        env:
          PLATFORM: ${{ matrix.name }}
        run: node scripts/collect-release.js
      - name: Upload verified installers to draft release
        if: needs.prepare.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release upload "$TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
      - name: Remove signing keychain
        if: always() && runner.os == 'macOS' && inputs.sign_macos
        run: |
          security delete-keychain "$RUNNER_TEMP/arca-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/arca.p12"
  docker:
    needs: [prepare, desktop]
    env:
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    if: needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24.14.0"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          load: true
          tags: arca-smoke:local
      - run: node scripts/verify-docker.js arca-smoke:local
      - name: Build ARM image for smoke verification
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/arm64
          load: true
          tags: arca-smoke:arm64
      - run: node scripts/verify-docker.js arca-smoke:arm64
      - name: Sign in to Docker Hub
        if: needs.prepare.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish verified multiarch image to Docker Hub
        if: needs.prepare.outputs.publish == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            satoshiltd/arca:${{ needs.prepare.outputs.version }}
            satoshiltd/arca:latest
          provenance: false
  publish:
    if: needs.prepare.outputs.publish == 'true'
    needs: [prepare, desktop, docker]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Verify assets and publish draft release
        env:
          SIGN: ${{ inputs.sign_macos }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir assets
          for suffix in macos-arm64.dmg windows-x64.exe linux-x64.AppImage linux-x64.deb; do
            asset="arca-$VERSION-$suffix"
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$asset" --dir assets
            test -s "assets/$asset"
          done
          (cd assets && sha256sum * > SHA256SUMS)
          gh release upload "$TAG" assets/SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
          macos_status="ad-hoc signed, not notarized (macOS may block downloaded apps)"
          if [[ "$SIGN" == true ]]; then macos_status="Developer ID signed and notarized"; fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --notes "Alpha direct downloads: macOS $macos_status; Windows unsigned. Linux and Windows need real installation qualification. Docker: satoshiltd/arca:$VERSION (amd64/arm64; also tagged latest). No automatic updates or pilot deployment."
