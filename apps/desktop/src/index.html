<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Arca</title>
    <link rel="icon" href="assets/arca-icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <div class="window-drag"></div>
        <a class="brand" href="#" data-view="folders"
          ><div class="brand-mark" role="img" aria-label="Arca">
            <svg class="brand-logo" viewBox="0 0 512 512" aria-hidden="true">
              <rect
                x="8"
                y="8"
                width="496"
                height="496"
                rx="116"
                fill="var(--mark-tile)"
              />
              <g class="brand-glyph">
                <path
                  d="M136 370V232a120 120 0 0 1 240 0v138h-58V232a62 62 0 0 0-124 0v138z"
                  fill="var(--mark-arch)"
                />
                <rect
                  x="224"
                  y="276"
                  width="64"
                  height="94"
                  rx="8"
                  fill="var(--mark-door)"
                />
              </g></svg
            ><span class="brand-busy" aria-hidden="true"></span>
          </div>
          <span><b>arca</b></span></a
        >
        <div class="managing">
          <span data-icon="monitor"></span
          ><strong id="managed-name">This machine</strong
          ><span id="managed-role" class="machine-role"></span>
        </div>
        <nav aria-label="Main navigation">
          <button class="nav-item active" data-view="folders">
            <span data-icon="folder"></span>Folders
          </button>
          <button class="nav-item" data-view="devices">
            <span data-icon="monitor-smartphone"></span>Machines
          </button>
          <button class="nav-item" data-view="history">
            <span data-icon="history"></span>History<span
              id="conflict-count"
              class="count"
              hidden
            ></span>
          </button>
          <button class="nav-item" data-view="settings">
            <span data-icon="settings"></span>Settings
          </button>
        </nav>
        <div class="sidebar-bottom">
          <div class="status-card">
            <strong id="connection">Connecting…</strong
            ><span id="last-sync">Checking your daemon</span
            ><button
              class="backup-link"
              data-action="backup-settings"
              id="backup-summary"
            >
              Hub backup status unknown
            </button>
          </div>
          <button class="ghost sign-out" data-action="logout" hidden>
            <span data-icon="log-out"></span>Sign out
          </button>
        </div>
      </aside>
      <main>
        <div id="notice" role="status" hidden></div>
        <section id="content">
          <div class="heading"><h1>Arca</h1></div>
          <div class="page">
            <div class="scaffold-row" role="status" aria-label="Loading Arca">
              <span class="scaffold-mark" aria-hidden="true"></span>
              <div class="scaffold-copy">
                <span
                  class="scaffold-line scaffold-medium"
                  aria-hidden="true"
                ></span
                ><span
                  class="scaffold-line scaffold-long"
                  aria-hidden="true"
                ></span>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>
    <dialog id="dialog" aria-labelledby="dialog-title">
      <form id="dialog-form">
        <div id="dialog-content"></div>
        <div id="dialog-error" class="dialog-error" role="alert" hidden></div>
        <div class="dialog-actions">
          <button type="button" class="secondary" id="cancel-dialog">
            Cancel</button
          ><button class="primary" type="submit" id="submit-dialog">
            Save
          </button>
        </div>
      </form>
    </dialog>
    <script src="vendor/lucide.js"></script>
    <script src="app.js" type="module"></script>
  </body>
</html>
