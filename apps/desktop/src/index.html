<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Arca</title>
    <link rel="icon" href="assets/arca-icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="starting-mode">
    <div class="shell">
      <aside class="sidebar">
        <div class="window-drag"></div>
        <a class="brand" href="#" data-view="folders"
          ><div class="brand-mark" role="img" aria-label="Arca">
            <svg class="brand-logo" viewBox="0 0 512 512" aria-hidden="true">
              <rect
                x="8"
                y="8"
                width="496"
                height="496"
                rx="128"
                fill="var(--mark-tile)"
              />
              <path
                d="M144 380V233a112 112 0 0 1 224 0v147h-60V233a52 52 0 0 0-104 0v147z"
                fill="var(--mark-arch)"
              />
              <path
                class="brand-door"
                d="M228 380V294a28 28 0 0 1 56 0v86z"
                fill="var(--mark-door)"
              />
            </svg>
          </div>
          <span><b>arca</b></span></a
        >
        <button type="button" class="palette-open" data-action="palette" aria-label="Search">
          <span data-icon="search"></span><span>Search</span
          ><span class="tag palette-key">⌘K</span>
        </button>
        <nav aria-label="Main navigation">
          <button class="nav-item active" data-view="folders">
            <span data-icon="folder"></span>Folders
          </button>
          <button class="nav-item" data-view="devices">
            <span data-icon="monitor-smartphone"></span>Devices
          </button>
          <button class="nav-item" data-view="history">
            <span data-icon="history"></span>History<span
              id="conflict-count"
              class="count"
              hidden
            ></span>
          </button>
          <button class="nav-item" data-view="settings">
            <span data-icon="settings"></span>Settings
          </button>
        </nav>
        <div id="favorites" class="favorites" role="group" aria-label="Favorites" hidden>
          <div class="favorites-head section-label" aria-hidden="true"><span>Favorites</span></div>
          <div class="favorites-list"></div>
        </div>
        <div class="sidebar-bottom">
          <div class="update-card" id="update-card" hidden>
            <strong id="update-heading">Update available</strong>
            <p class="hint" id="update-note" hidden>Sync pauses while Arca restarts.</p>
            <button class="secondary small-button" id="update-install" data-action="install-update">
              Update and restart
            </button>
          </div>
          <div id="music-mini" class="music-mini" role="region" aria-label="Now playing" hidden></div>
          <div class="status-card" role="group" aria-label="Status" hidden>
            <div id="status-device" class="status-device" hidden></div>
            <div class="sync-status-heading">
              <strong id="connection">Connecting…</strong>
            </div>
            <span id="last-sync">Checking Arca</span>
            <div id="sync-controls" hidden></div>
            <button class="backup-link" id="backup-summary" data-action="backup-settings" hidden></button>
          </div>
          <button class="ghost sign-out" data-action="logout" hidden>
            <span data-icon="log-out"></span>Sign out
          </button>
        </div>
      </aside>
      <main>
        <div id="notice" role="status" hidden></div>
        <section id="content">
          <div class="launch-mark" role="status" aria-label="Starting Arca">
            <svg viewBox="116 100 280 296" aria-hidden="true">
              <path
                class="brand-draw-band"
                pathLength="100"
                d="M170 380V233A86 86 0 0 1 256 147h2"
              />
              <path
                class="brand-draw-band"
                pathLength="100"
                d="M342 380V233A86 86 0 0 0 256 147h-2"
              />
              <path
                class="brand-draw-door"
                d="M228 380V294a28 28 0 0 1 56 0v86z"
              />
            </svg>
            <p>Starting Arca…</p>
          </div>
        </section>
        <div id="music-player" class="music-player" role="region" aria-label="Now playing" hidden></div>
      </main>
    </div>
    <dialog id="dialog" aria-labelledby="dialog-title">
      <form id="dialog-form">
        <div id="dialog-content"></div>
        <div id="dialog-error" class="dialog-error" role="alert" hidden></div>
        <div class="dialog-actions">
          <button type="button" class="secondary" id="cancel-dialog">
            Cancel</button
          ><button class="primary" type="submit" id="submit-dialog">
            Save
          </button>
        </div>
      </form>
    </dialog>
    <script src="vendor/lucide.js"></script>
    <script src="app.js" type="module"></script>
  </body>
</html>
